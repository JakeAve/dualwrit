<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dualwrit</title>
    <meta name="description"
      content="Write English in other alphabets: the Deseret alphabet and the runes of The Hobbit.">
    <meta name="theme-color" content="#e8eeec">
    <link rel="icon" type="image/png" sizes="48x48" href="favicon.png">
    <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Dualwrit">
    <meta property="og:description"
      content="Write English in other alphabets.">
    <meta property="og:url" content="https://jakeave.github.io/dualwrit/">
    <meta property="og:image"
      content="https://jakeave.github.io/dualwrit/deseret/og.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt"
      content="The Deseret Alphabet written in Deseret letters, above a row of letter tiles with example words.">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+Deseret&family=Noto+Sans+Runic&family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&display=swap">
    <link rel="stylesheet" href="site.css">
    <style>
    :root {
      --script: "Noto Sans Deseret", "Apple Symbols", "Segoe UI Historic", sans-serif;
    }
    .cards {
      display: flex;
      flex-wrap: wrap;
      gap: 1.25rem;
    }
    .card {
      flex: 1 1 16rem;
      max-width: 20rem;
      padding: 1.25rem 1.5rem;
      background: var(--sheet);
      border: 1.5px solid var(--ink);
      color: inherit;
      text-decoration: none;
    }
    .card:hover {
      background: var(--honey-wash);
    }
    .card .d {
      display: block;
      font-size: 2.6rem;
      line-height: 1.2;
    }
    .card .d[lang="en-Runr"] {
      font-family: "Noto Sans Runic", "Segoe UI Historic", "Apple Symbols",
        sans-serif;
    }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Dualwrit</h1>
        <p>Write English in other alphabets.</p>
      </header>
      <div class="cards">
        <a class="card" href="deseret/">
          <span class="d" lang="en-Dsrt">𐐔𐐯𐑅𐐨𐑉𐐯𐐻</span>
          The Deseret Alphabet
        </a>
        <a class="card" href="runes/">
          <span class="d" lang="en-Runr">ᚱᚢᚾᛖᛋ</span>
          Hobbit Runes
        </a>
      </div>
    </main>
  </body>
</html>
