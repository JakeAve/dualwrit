<!doctype html>
<!-- Source for web/runes/og.png (1200x630). How to re-render: see "Develop" in the README -->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+Runic&family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&display=block">
    <style>
    :root {
      --salt: #e8eeec;
      --sheet: #f8faf9;
      --ink: #1c2742;
      --sage: #5f7566;
      --rule: #b9c6c0;
      --honey: #c58a17;
      --honey-wash: #f6e6bf;
    }
    * {
      box-sizing: border-box;
    }
    html,
    body {
      margin: 0;
      width: 1200px;
      height: 630px;
      overflow: hidden;
    }
    body {
      background: var(--salt);
      color: var(--ink);
      font-family: "Old Standard TT", Georgia, serif;
      padding: 44px;
    }
    .d {
      font-family: "Noto Sans Runic", "Apple Symbols", sans-serif;
    }
    .frame {
      height: 100%;
      border: 3px solid var(--ink);
      background: var(--sheet);
      padding: 46px 56px 0;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }
    h1 {
      margin: 0;
      font-weight: 400;
      font-size: 84px;
      line-height: 1.05;
      white-space: nowrap;
    }
    .said {
      font-style: italic;
      font-size: 44px;
      color: var(--sage);
      margin-top: 14px;
    }
    .line {
      font-size: 32px;
      margin-top: 22px;
      max-width: 880px;
      line-height: 1.35;
    }
    .line b {
      color: var(--honey);
    }
    .tiles {
      position: absolute;
      left: 56px;
      right: -40px;
      bottom: -34px;
      display: flex;
      gap: 14px;
    }
    .tile {
      flex: 0 0 132px;
      height: 150px;
      border: 2px solid var(--rule);
      background: var(--salt);
      padding: 10px 14px;
      font-size: 64px;
      line-height: 1.1;
    }
    .tile small {
      display: block;
      font-family: "Old Standard TT", serif;
      font-size: 24px;
      margin-top: 2px;
    }
    .tile small b {
      color: var(--honey);
    }
    .tile.on {
      background: var(--honey-wash);
      border-color: var(--honey);
    }
    </style>
  </head>
  <body>
    <div class="frame">
      <h1 class="d">ᚦᛖ ᚱᚢᚾᛖᛋ ᚩᚠ ᚦᛖ ᚻᚩᛒᛒᛁᛏ</h1>
      <div class="said">The Runes of The Hobbit</div>
      <div
        class="line">The runes Tolkien used in the book. Learn them and write anything <b>letter by letter</b>.</div>
      <div class="tiles d">
        <div class="tile">ᚱ<small><b>r</b>un</small></div>
        <div class="tile">ᛒ<small><b>b</b>ed</small></div>
        <div class="tile on">ᚦ<small><b>th</b>in</small></div>
        <div class="tile">ᛝ<small>si<b>ng</b></small></div>
        <div class="tile">ᛱ<small><b>k</b>ing</small></div>
        <div class="tile">ᛲ<small><b>sh</b>ip</small></div>
        <div class="tile">ᛳ<small>m<b>oo</b>n</small></div>
        <div class="tile">ᛟ<small>s<b>ee</b></small></div>
        <div class="tile">ᛠ<small><b>ea</b>t</small></div>
      </div>
    </div>
  </body>
</html>
