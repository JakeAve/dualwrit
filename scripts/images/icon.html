<!doctype html>
<!-- Source for web/icon-512.png (the letter Dee, for Deseret). How to re-render: see "Develop" in the README -->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+Deseret&display=block">
    <style>
    html,
    body {
      margin: 0;
      width: 512px;
      height: 512px;
      overflow: hidden;
      background: transparent;
    }
    .icon {
      width: 512px;
      height: 512px;
      border-radius: 112px;
      background: #1c2742;
      display: grid;
      place-items: center;
      box-shadow: inset 0 0 0 20px #c58a17;
    }
    .icon span {
      font: 330px/1 "Noto Sans Deseret", "Apple Symbols", sans-serif;
      color: #f6e6bf;
      transform: translateY(-8px);
    }
    </style>
  </head>
  <body>
    <div class="icon"><span>𐐔</span></div>
  </body>
</html>
